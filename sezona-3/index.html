{t:"genre",w:"Matej",g:"Epska origin priča",n:"Čovjek s trapeza"},
{t:"narr",x:"Prije čaja. Prije Boeinga. Prije vile. Postojao je samo crveni šator."},
{t:"scene",l:[["","Cirkus. Reflektor. Dječak u zelenom odijelu leti s trapeza na trapez."],["Publika","MA-TEJ! MA-TEJ!"],["","Trostruki salto. Savršeno slijetanje. Pilotu nitko nikad ne pljesne. Njemu pljesnu svi."]]},
{t:"conf",w:"Matej",q:"Bio sam najbolji na trapezu. Ali kad sam visio naglavačke, gledao sam kroz rupu na vrhu šatora. U zvijezde. Trapez me nije ispunjavao. Zvijezde jesu."},
{t:"scene",l:[["","Noću, dok cirkus spava, Matej pod svijećom čita. Newton. Kepler. Diferencijalni račun."],["Klaun","Mali, što to čitaš?"],["Matej","Zašto stvari padaju."],["Klaun","Pa ti nikad ne padaš."],["Matej","Upravo zato želim znati."]]},
{t:"big",x:"POŽAR.",s:"Jedne noći crveni šator je izgorio. Ostali su samo Matej i njegove knjige.",sh:1},
{t:"scene",l:[["","Pepeo. Tišina. Matej drži udžbenik mehanike. Rubovi su pougljenili. Formule su preživjele."],["Matej","(tiho) Zakon očuvanja energije. Ništa ne nestaje. Samo mijenja oblik."]]},
{t:"scene",l:[["","Obitelj pravnika Miličević. Velika kuća. Puno knjiga. Nijedna o trapezu."],["Gospođa Miličević","Mateju, želiš li čaj?"],["","Matej prvi put proba čaj. Nešto u njemu klikne. Zauvijek."],["Matej","APSOLUTNO."]]},
{t:"scene",l:[["","Zrakoplovno inženjerstvo. Najmlađi student na faksu. Prvi dan. Netko mu sjedne do njega."],["Luka","Buraz, jesi ti ovdje greškom ili si genij?"],["Matej","Oboje je statistički moguće."],["Luka","Autism in children. Ja sam Luka, računarstvo. Igraš D&D?"]]},

{t:"conf",w:"Matej",q:"Ovo su bili moji prijatelji. Bili smo nezaustavljivi u matematici, fizici i bacanju d20. Ali tko zna koga ću još upoznati da mi promijeni život zauvijek…"},

{t:"scene",l:[["","Sara u bijeloj kuti. Šminka: ljubičasti eyeliner, zelene sjene, šljokice. Munja osvijetli stol."],["Sara","Večeras… stvaram život."],["","Na stolu leži tijelo od dijelova. Ruke košarkaša. Mozak šahista. Srce… punjeno Traubisodom."]]},
{t:"big",x:"ŽIVO JE!",s:"Stvorenje otvori oči. Prve riječi: „Nije vino.“",sh:1},
{t:"scene",l:[["Stvorenje","Nije vino… nije voda…"],["Sara","(plače od sreće) …to je Traubisoda."],["","Sara je stvorila savršenog propagandista. Ili je ona postala jedan. Nitko ne zna gdje prestaje Sara, a počinje Traubisoda."]]},
{t:"scene",l:[["","Ponoć. Laboratorij. Nešto zuji."],["Sara","…što je to?"],["","Na zidu: buba. Mala. Smeđa. Nije bubamara. Nije leptir."],["","Sara vrisne. Stvorenje vrisne. Munja vrisne."],["","Sara pobjegne. Stvorenje ostane s bubom. Stvorenje je, kako se pokazalo, hrabrije od svoje stvoriteljice."]]},

{t:"scene",l:[["","5:40 ujutro. Autobusni kolodvor. Sabina u sunčanim naočalama i kapuljači. Nonšalantno."],["Instruktor","Kandidatkinja Sabina?"],["Sabina","Ne znam o kome pričate."],["Instruktor","Na popisu piše Sabina. Kategorija D."],["Sabina","…a brate. Ajde."]]},

{t:"scene",l:[["","Za to vrijeme, u kuhinji komune."],["Veronika","Ja sam mama ove ekipe."],["Marta","Ne, ja sam mama ove ekipe."],["Veronika","Ja vičem na njih."],["Marta","Ja ih grlim."],["","Ulazi Salak. Nosi lonac juhe. Svima je već izmjerio temperaturu. Nikome nije rekao."],["Salak","Jeste li jeli? Obucite se, puše."]]},

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const col=w=>C[w]||"#F4E8EE";
const pill=w=>`<span class="nm" style="background:${col(w)}22;color:${col(w)}">${esc(w)}</span>`;
const word=(t,cls)=>[...t].map((ch,i)=>`<span style="animation-delay:${(i*0.07).toFixed(2)}s">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");

function render(s){
 switch(s.t){
 case "warn":return `<div class="scr center warn"><div class="w1">UPOZORENJE</div>
 <p style="animation-delay:.9s">Ovo nije Love Island.</p>
 <p style="animation-delay:2.4s">Ponavljamo: ovo NIJE Love Island.</p>
 <p style="animation-delay:3.6s">Vila je zatvorena. Ambalaža je vraćena.</p></div><div class="hint">tapni desno za dalje →</div>`;
 case "prod":return `<div class="scr center prod"><div class="spot"></div><div class="wrap">
 <div class="row">${word("KOMUNALNA")}</div><div class="row up">${word("PRODUKCIJA").replace(/animation-delay:([\d.]+)s/g,(m,d)=>"animation-delay:"+(+d+0.8).toFixed(2)+"s")}</div>
 <div class="pr">predstavlja nešto novo</div></div></div>`;
 case "spons":{
  const feet=[0,1,2,3,4].map(i=>`<span style="animation-delay:${(0.3+i*0.28).toFixed(2)}s">👣</span>`).join("");
  const top=s.ad?"REKLAMA":(s.out?"VIDIMO SE · UZ POTPORU SPONZORA":"UZ POTPORU SPONZORA");
  const tl=s.ad===1?"Svaka boca se računa. Pitajte Saru.":s.ad===2?"Sada i s regeneratorom. Upitajte Luku.":s.out?"Nijedno porijeklo nije provjereno. Nijedno.":"Jer u komuni je sve zajedničko. Sve.";
  return `<div class="scr center spons"><div class="sm">${top}</div><div class="feet">${feet}</div>
  <div class="nm3">MARTINA<br>(KOMUNALNA)<br>STOPALA</div><div class="tl">${tl}</div></div>`;}
 case "traubi":return `<div class="scr center spons"><div class="sm">I SU-SPONZOR</div>
 <div class="nm3" style="color:#B79BFF">TRAUBISODA</div><div class="tl">Nije vino. Nije voda.</div>
 <div class="tl" style="animation-delay:3.4s;font-style:normal;font-weight:700;color:var(--krem)">To je Traubisoda.</div></div>`;
 case "quiz":return `<div class="scr center quiz"><p class="h" style="font-size:22px;line-height:1.3">Vaša porijekla su zaprimljena.</p>
 <div class="pb"><i></i></div><div class="pc">Provjeravamo činjenice…</div>
 <div class="zap">Zapravo…</div><div class="lie">POLA STE IZMISLILI.</div></div>`;
 case "logo":return `<div class="scr center lg"><div class="heart">♥</div><div class="l1">Prije vile</div><div class="l2">PORIJEKLA</div>
 <div class="l3">Sezona 3 · prvi dio · šest žanrova</div></div><div class="hint">tapni za početak</div>`;
 case "title":return `<div class="scr center ttl"><div class="logo" style="font-size:30px;animation:fadeIn .5s both">Love Island</div>
 <div class="h" style="letter-spacing:6px;color:var(--koralj);font-size:13px;margin:2px 0 40px">ADRIA</div>
 <span class="ep">Epizoda ${s.ep}</span><div class="nm2">${esc(s.n)}</div></div>`;
 case "genre":return `<div class="scr center ttl"><div class="logo" style="font-size:28px;animation:fadeIn .5s both">Prije vile</div>
 <div class="h" style="letter-spacing:6px;color:var(--koralj);font-size:13px;margin:2px 0 40px">PORIJEKLA</div>
 <span class="ep">${esc(s.g)}</span><div class="nm2" style="color:${col(s.w)}">${esc(s.w)}</div>
 <p class="narr" style="margin-top:16px;font-size:18px;animation:fadeIn .6s 1.4s both">„${esc(s.n)}“</p></div>`;
 case "narr":return `<div class="scr center"><p class="narr" style="font-size:19px;line-height:1.55">${esc(s.x)}</p></div>`;
 case "scene":return `<div class="scr">${s.l.map((l,i)=>l[0]?`<div class="ln" style="animation-delay:${i*0.18}s">${pill(l[0])}<p>${esc(l[1])}</p></div>`:`<div class="ln" style="animation-delay:${i*0.18}s"><p class="dir">${esc(l[1])}</p></div>`).join("")}</div>`;
 case "conf":return `<div class="scr conf"><p class="lab">🎙 ISPOVJEDAONICA</p><p class="q">„${esc(s.q)}“</p>
 <div class="tag"><span class="h" style="font-size:17px;color:${col(s.w)}">${esc(s.w)}${s.w==="Lara"?" (?)":""}</span></div></div>`;
 case "msg":return `<div class="scr center"><div class="msg"><div class="hd">💬 Love Island Adria · sada</div>
 <div class="bd" style="text-align:left"><b>${esc(s.b)}</b><p>${esc(s.x)}</p></div></div></div>`;
 case "card":return `<div class="scr center"><div class="card" style="text-align:left;border-color:${col(s.w)}">
 <div style="display:flex;justify-content:space-between;align-items:center"><span class="h" style="font-size:19px">${esc(s.w)}</span><span style="color:${col(s.w)}">♥</span></div>
 <div class="art" style="background:${col(s.w)}22;color:${col(s.w)}">${esc(s.w[0])}</div>
 <div class="ty" style="color:${col(s.w)}">${esc(s.ty)}</div><div class="ab">${esc(s.ab)}</div><div class="fl">${esc(s.fl)}</div><div class="pt">${esc(s.pt)}</div></div></div>`;
 case "big":return `<div class="scr center big"><div class="${s.sh?"shake":""}"><div class="t">${esc(s.x)}</div></div><div class="s">${esc(s.s||"")}</div></div>`;
 case "list":return `<div class="scr ep-list"><p class="h" style="font-size:24px;color:var(--pink);margin-bottom:22px">${esc(s.h)}</p>${s.l.map((x,i)=>`<p class="d${Math.min(i+1,7)}">${esc(x)}</p>`).join("")}</div>`;
 case "credits":{
  const R=[["Režija","Komuna"],["Scenarij","sami Otočani (nažalost)"],["Cirkus i trapez","Matej"],["Laboratorij","Sara"],["Stvorenje","Traubisoda"],["Kategorija D","Sabina (nitko ne zna)"],["Putnica","Lana"],["Razglednica","Kiara"],["Teologija slavlja","Jona (9 dana)"],["Tarot i karta Krevet","Veronika"],["Žena od zvijezda","nepoznato, imala je upaljač"],["Suze","Dani (hidratacija)"],["Tiramisu","Dani"],["Vozačica","Dani"],["Hladnjak","Helena"],["Plesači s kobasicama","nitko ne zna odakle"],["Prava mama","Salak"],["Juha","Salak"],["Posebna zahvala","svima koji su poslali backstory 🫰"]];
  return `<div class="scr credits"><div class="roll"><p class="logo" style="font-size:40px;margin-bottom:40px">Prije vile</p>${R.map(r=>`<div class="r"><small>${esc(r[0])}</small><span>${esc(r[1])}</span></div>`).join("")}<p class="narr" style="margin-top:40px">Svi likovi su stvarni. Porijekla su izmišljena. Uglavnom sami.</p></div></div>`;}
 case "end":return `<div class="scr center lg"><div class="heart">♥</div><div class="big"><div class="t">KRAJ.</div></div>
 <p class="narr" style="margin-top:22px">Drugi dio? Pošaljite backstoryje.</p><button class="again" id="again">Gledaj ispočetka</button><br><a class="again" style="display:inline-block;margin-top:14px;background:var(--sljiva);color:var(--krem);text-decoration:none" href="../sezona-2/" onclick="event.stopPropagation()">← Sezona 2</a></div>`;
 }
}

const stage=document.getElementById("stage"),prog=document.getElementById("prog"),lbl=document.getElementById("lbl");
const EP=[];let cur="Komunalna produkcija";S.forEach(x=>{if(x.t==="genre")cur="Porijeklo: "+x.w;if(x.t==="credits")cur="Odjavna špica";EP.push(cur)});
let k=0;
try{const v=parseInt(localStorage.getItem("lia3-pos"));if(v>0&&v<S.length)k=v}catch(e){}
function show(i){
 k=Math.max(0,Math.min(S.length-1,i));
 stage.innerHTML=render(S[k]);
 prog.style.width=(k/(S.length-1)*100).toFixed(1)+"%";
 lbl.textContent=EP[k];
 try{localStorage.setItem("lia3-pos",k)}catch(e){}
 const a=document.getElementById("again");if(a)a.onclick=ev=>{ev.stopPropagation();show(0)};
}
stage.addEventListener("click",ev=>{const r=stage.getBoundingClientRect();show(ev.clientX-r.left<r.width/3?k-1:k+1)});
document.addEventListener("keydown",ev=>{if(["ArrowRight"," ","Enter"].includes(ev.key)){ev.preventDefault();show(k+1)}if(ev.key==="ArrowLeft")show(k-1)});
let tx=null;stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){e.preventDefault();show(dx<0?k+1:k-1)}});
document.getElementById("restart").onclick=ev=>{ev.stopPropagation();show(0)};
show(k);
</script>
</body>
</html>
