<style>
:root{--noc:#1B1020;--ponoc:#120A16;--sljiva:#2A1B31;--pink:#FF5C93;--koralj:#FF8A6B;--sunce:#FFC93C;--krem:#F4E8EE;--siva:#A8909F}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.logo{font-family:'Pacifico',cursive;color:var(--pink)}
.narr{font-style:italic;color:var(--siva);font-size:15px;line-height:1.55;margin:0 0 18px}
.ln{margin:0 0 16px;animation:lineIn .4s ease both}

.conf{background:var(--ponoc)}

@keyframes slideR{from{transform:translateX(-100%)}to{transform:none}}

.card .ab{font-size:14px;line-height:1.5;margin-bottom:10px}
.card .fl{font-size:14px;font-style:italic;color:var(--siva)}
.card .pt{text-align:right;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;color:var(--koralj);margin-top:6px}

.d1{animation-delay:.15s!important}.d2{animation-delay:.3s!important}.d3{animation-delay:.45s!important}.d4{animation-delay:.6s!important}.d5{animation-delay:.75s!important}.d6{animation-delay:.9s!important}.d7{animation-delay:1.05s!important}

@keyframes blink{50%{opacity:0}}
.prod .row{display:flex;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:2px}
.prod .row span{display:inline-block;opacity:0;animation:drop .5s cubic-bezier(.2,1.6,.4,1) both}

.prod .pr{font-family:'Pacifico',cursive;color:var(--pink);font-size:24px;margin-top:20px;opacity:0;animation:fadeIn .8s 2.4s both}

.feet span{opacity:0;animation:step .3s both}
.feet span:nth-child(odd){transform:translateY(10px)}

.spons .sm{font-size:13px;letter-spacing:3px;color:var(--siva);margin-bottom:18px;animation:fadeIn .6s both}
.spons .nm3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1.1;color:var(--koralj);animation:slam .6s 1.8s both}
.spons .tl{margin-top:18px;font-style:italic;color:var(--siva);animation:fadeIn .6s 2.6s both}
.quiz .pb{width:100%;height:10px;background:#3a2840;border-radius:6px;overflow:hidden;margin:26px 0 10px}
.quiz .pb i{display:block;height:100%;width:0;background:var(--pink);animation:fill 3s cubic-bezier(.3,.8,.4,1) .4s forwards}
@keyframes fill{to{width:99%}}
.quiz .pc{font-size:13px;color:var(--siva)}
.quiz .lie{margin-top:40px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;color:#FF4D4D;opacity:0;animation:glitch .9s 4.4s both}
.quiz .zap{margin-top:18px;font-size:16px;color:var(--siva);opacity:0;animation:fadeIn .5s 3.8s both}
@keyframes glitch{0%{opacity:0;transform:skewX(40deg)}20%{opacity:1;transform:skewX(-30deg) translateX(-10px)}40%{transform:skewX(20deg) translateX(8px);color:#5cf}60%{transform:skewX(-10deg);color:#FF4D4D}100%{opacity:1;transform:none}}
.lg .heart{font-size:54px;color:var(--pink);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.lg .l1{font-family:'Pacifico',cursive;font-size:56px;color:var(--pink);line-height:1.2;animation:slam .8s .3s both}
.lg .l2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:var(--koralj);animation:spread 1.4s 1s both}
@keyframes spread{from{letter-spacing:0;opacity:0}to{letter-spacing:12px;opacity:1}}
.lg .l3{margin-top:40px;font-size:14px;color:var(--siva);animation:fadeIn .6s 2s both}
.credits{overflow:hidden;padding-top:0;padding-bottom:0}
.roll{animation:roll 32s linear both;text-align:center;padding-top:100dvh}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-100%)}}
.roll .r{margin-bottom:22px}
.roll .r small{display:block;font-size:12px;letter-spacing:2px;color:var(--siva);text-transform:uppercase;margin-bottom:3px}
.roll .r span{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px}
.again{pointer-events:auto;margin-top:34px;background:var(--pink);color:#2a0716;border:0;border-radius:24px;padding:12px 26px;font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;animation:fadeIn .6s 1.6s both}
</style>

"Salak":"#D9C27A","Marta":"#FFC2D6","Helena":"#FFAA8F","Lara":"#FFAA8F","Danijela":"#FF6B6B","Veronika":"#E59BFF","Sara":"#9AA8FF","Kiara":"#F2D16B","Damjan":"#8FE3D0","Sabina":"#B8C4CC",
"Producent":"#FFC93C","Sestra Danijela":"#FF6B6B","Svi":"#F4E8EE"};
const S=[

{t:"title",ep:1,n:"Zabranjeni parovi"},
{t:"narr",x:"Prošla sezona završila je sretno. Svi su bili zaljubljeni, siti i ocijenjenih stopala. Producentima to nije odgovaralo."},
{t:"narr",x:"Zato se svih četrnaest vraća. Ista vila. Isti bazen. Nova pravila."},
{t:"scene",l:[["","Antun i Nina ulaze zajedno. Business casual. Sako. Mapa s dokumentima."],["Luka","Buraz, zašto izgledate kao da ćete nas otpustiti?"],["Nina","Jer možda hoćemo."],["Antun","Imamo sastanak u dva. S bazenom."]]},
{t:"scene",l:[["Nina","Luka. Četiri."],["Luka","Što četiri?"],["Nina","Stopala. Prošle sezone si ti ocjenjivao. Sad se ocjenjuje tebe."],["Luka","…pošteno."]]},
{t:"scene",l:[["","Marta ulazi. Svi zašute."],["Sabina","A brate. Što je ovo."],["Marta","Samo haljina?"],["Veronika","Dijete moje, to nije samo haljina. To je događaj."],["","Marta je moggala vilu u četiri sekunde. Bazen je pokušao uzvratiti. Nije uspio."]]},
{t:"scene",l:[["","Sara ulazi s kartonskom kutijom."],["Luka","Što je to?"],["Sara","Traubisoda."],["Luka","Iz Mađarske?"],["Sara","Nije vino. Nije voda."],["Svi","TO JE TRAUBISODA."],["","Nitko ne zna zašto ovo svi znaju napamet."]]},
{t:"scene",l:[["","Sara otvori lunchbox. Pregrade. Nerds bombini, sendvič izrezan u zvjezdicu, mrkvice."],["Luka","Buraz, je l' ti mama to složila?"],["Sara","Sama."],["Luka","Mogu jedan Nerds?"],["","Sara podigne obrvu. Samo jednu."],["","Luka nije dobio Nerds."]]},
{t:"scene",l:[["","Helena ulazi s plastičnom bocom bez etikete."],["Jona","Što je u boci?"],["Helena","Rakija. Domaća."],["Jona","Čija?"],["Helena","Moja."],["Jona","Kako misliš, tvoja?"],["Helena","Ne pitaj, Jona. Samo vjeruj."]]},
{t:"scene",l:[["","Danijela ulazi. Na suncu joj je kosa… narančasta."],["Luka","Joj. Ginger se vratila."],["Danijela","Smeđa sam."],["Luka","Na ovom suncu si mrkva."],["Danijela","Ma ja ba, Luka. Smeđa. A real."],["","Mobitel u njezinoj ruci se lagano zatrese. Ne danas. Ali uskoro."]]},
{t:"scene",l:[["Perić","Mateju! Kako si?"],["Matej","Dobro. Na putu sam opet gledao Verity."],["Perić","Što je Verity?"],["Matej","Film. Kad se nekome dovoljno približiš, saznaš sve što je skrivao."],["Leko","…to je zapravo jako dobar opis ove emisije."],["Matej","Znam. Zato sam ga gledao."]]},
{t:"scene",l:[["Sabina","Periću, gdje je hlad?"],["Perić","Ne znam."],["Sabina","Gdje su ručnici?"],["Perić","Ne znam."],["Sabina","Jesi li ti uopće Perić?"],["Perić","…ne znam."]]},
{t:"conf",w:"Perić",q:"Prošle sezone sam znao sve odgovore. Onda sam shvatio da je ljepše kad ne znam. Ljudi te pitaju još jednom. I još jednom. Ne znam. Sviđa mi se."},
{t:"scene",l:[["","Salak ulazi zadnji. Ovaj put s aktovkom."],["Salak","Dobar dan. Diplomirao sam bračnu terapiju."],["Antun","Gdje?"],["Salak","Na YouTubeu. Dvadeset minuta, na 1,5x."],["Nina","Nitko ovdje nije u braku."],["Salak","Još."]]},
{t:"msg",b:"Imam poruku!",x:"Otočani, dobrodošli natrag! Novo pravilo: parovi iz prošle sezone su ZABRANJENI. Večeras birate nove. #drama #nemavraćanja"},
{t:"big",x:"ZABRANJENI.",s:"Sedam parova. Sedam razvoda. Jedna večer."},
{t:"scene",l:[["Antun","Mateju…"],["Matej","Pročitao sam pravila. Pravila su jasna."],["Antun","Ali—"],["Matej","Antune. Ja ne kršim pravila."],["","Matej se okrene. Pa se okrene natrag."],["Matej","Osim iz dosade. Ali sad mi nije dosadno."]]},
{t:"narr",x:"Ceremonija. Prva bira Nina."},
{t:"scene",l:[["Nina","Iskreno? Mentalno volim žene više od muškaraca. Fizički sam straight. JBG."],["Nina","Zato biram nekoga s kim mogu imati najzdraviji brak u ovoj vili."],["Nina","Marta."],["Marta","Ja?"],["Nina","Ti. Nije romantično. Samo pravno."]]},
{t:"scene",l:[["Salak","(diže ruku) Treba li vam bračni terapeut?"],["Nina","Ne."],["Marta","Možda?"],["Nina","Marta."],["Marta","…ne?"],["Salak","Zaposlen sam."]]},
{t:"scene",l:[["Luka","Mateju. Buraz. Ti i ja."],["Matej","Ti i ja što?"],["Luka","Bromance. Najjači par u vili. Bez ljubljenja, samo vibe."],["Matej","Ja ne razumijem vibe."],["Luka","Ja ne razumijem ništa. Savršeni smo."],["Matej","…može. Ali čaj je moj."]]},
{t:"scene",l:[["Jona","Helena, biram tebe jer si razumna, mirna i—"],["Helena","Jona, kako se zove kršćanin koji pliva?"],["Jona","Ne znam."],["Helena","Krštenik."],["Jona","…to nije ni fora."],["Helena","Znam. Uzimam te."]]},
{t:"scene",l:[["Leko","Sara, prošle sezone smo krenuli zajedno. Bilo je mirno."],["Sara","Bilo je."],["Leko","Ajmo opet mirno."],["Sara","Ajmo."],["","Najkraći dogovor u povijesti formata. Šest sekundi."]]},
{t:"scene",l:[["Veronika","Periću, dođi mami."],["Perić","Što?"],["Veronika","Biram te. Izgubljen si. Treba ti netko."],["Perić","Treba li mi?"],["Veronika","Ti meni reci."],["Perić","…ne znam."],["Veronika","Vidiš? Treba ti mama."]]},
{t:"scene",l:[["Danijela","Sabina. Mi. Jedine dvije koje su skužile da Matej izgleda kao tepsija."],["Sabina","Mate tepsija."],["Danijela","MATE TEPSIJA."],["Matej","(iz daljine) Molim vas, ne."],["Sabina","Dobro. Ti i ja."],["Danijela","A real."]]},
{t:"scene",l:[["","Ostali su Antun i Salak."],["Salak","Antune, moram ti reći da sam sad zaposlen. Imam klijentice."],["Antun","Znači ja sam u paru s… radnim vremenom?"],["Salak","Od devet do pet. Osim kad je hitno."],["Antun","Ovo je najtužnija scena moje karijere. A glumio sam smrt."]]},
{t:"conf",w:"Antun",q:"Došao sam u sakou. S mapom. Spreman za sve. Osim za ovo. Ovoga nije bilo u mapi."},
{t:"narr",x:"Prva seansa. Salak je posudio dvije stolice i biljku. Biljka je najprofesionalnija stvar u sobi."},
{t:"scene",l:[["Salak","Dakle. Nina, Marta. Zašto ste ovdje?"],["Nina","Jer si nas natjerao."],["Salak","Zanimljivo. Marta, odakle ti modrica na ruci?"],["Marta","Udarila sam se o ormar."],["Nina","Udarila se o mene."],["Salak","(zapisuje) Nina. Agresija."],["Nina","Marta dobije modricu ako je pogledaš. Samo sam je potapšala."]]},
{t:"scene",l:[["Salak","Vježba povjerenja. Marta, padni unatrag, Nina će te uhvatiti."],["","Marta padne. Nina je uhvati. Marta dobije modricu od hvatanja."],["Salak","Napredak. Zadnje pitanje: je li vaš brak… konzumiran?"],["","Nina ga udari mapom."],["Salak","(s poda) Zapisujem: otpor terapiji."]]},
{t:"conf",w:"Salak",q:"Prošle sezone nisam htio biti ovdje. Sad imam posao, biljku i dvije klijentice. Ovo je najstabilniji period mog života."},
{t:"msg",b:"Imam poruku!",x:"Prvi izazov: Povratna ambalaža! Vila sama financira finalni party. Svaka boca vrijedi 10 centi. Najbolji par dobiva imunitet. #komuna #ekologija"},
{t:"scene",l:[["Luka","Buraz, ovo je naša sudbina."],["Matej","Za party od tisuću eura treba nam deset tisuća boca."],["Luka","Autism in children."],["Matej","To je matematika."],["Luka","Isto."]]},
{t:"scene",l:[["","Jona drži praznu bocu Traubisode."],["Sara","Jona. Povratna ambalaža."],["Jona","Još pijem."],["Sara","Prazna je."],["Jona","Duhovno nije."],["Sara","Povratna. Ambalaža."],["","Jona preda bocu. Sara je ubaci u vreću. Ne trepne."]]},
{t:"scene",l:[["","Leko i Sara voze golf kolica puna boca prema kontejneru."],["","Kolica se ugase. Na pola puta. Na nizbrdici."],["Sara","Opet?"],["Leko","Ne opet. Prvi put danas."],["Luka","(u prolazu) Buraz, zato si pao vozački."],["Leko","To je bio drugi auto. I drugi život."]]},
{t:"scene",l:[["Luka","Jona, ti ne skupljaš boce jer misliš da je to ispod tvoje razine."],["Jona","To je strawman."],["Luka","Nije strawman, buraz. Gledaj si kosu."],["Jona","Ako sad uzmem jednu bocu, sutra skupljam boce po cijeloj Požegi."],["Luka","To je slippery slope."],["Jona","…to je zapravo točno."],["","Prvi put su se složili. Oko logičke pogreške."]]},

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const col=w=>C[w]||"#F4E8EE";
const pill=w=>`<span class="nm" style="background:${col(w)}22;color:${col(w)}">${esc(w)}</span>`;
const word=(t,cls)=>[...t].map((ch,i)=>`<span style="animation-delay:${(i*0.07).toFixed(2)}s">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");

function render(s){
 switch(s.t){
 case "warn":return `<div class="scr center warn"><div class="w1">UPOZORENJE</div>
 <p style="animation-delay:.9s">Prošli put ste rekli da vam se sviđa.</p>
 <p style="animation-delay:2.4s">Stvarno ste to rekli.</p>
 <p style="animation-delay:3.6s">Sami ste krivi.</p></div><div class="hint">tapni desno za dalje →</div>`;
 case "prod":return `<div class="scr center prod"><div class="spot"></div><div class="wrap">
 <div class="row">${word("KOMUNALNA")}</div><div class="row up">${word("PRODUKCIJA").replace(/animation-delay:([\d.]+)s/g,(m,d)=>"animation-delay:"+(+d+0.8).toFixed(2)+"s")}</div>
 <div class="pr">se vraća</div></div></div>`;
 case "spons":{
  const feet=[0,1,2,3,4].map(i=>`<span style="animation-delay:${(0.3+i*0.28).toFixed(2)}s">👣</span>`).join("");
  const top=s.ad?"REKLAMA":(s.out?"VIDIMO SE · UZ POTPORU SPONZORA":"UZ POTPORU SPONZORA");
  const tl=s.ad===1?"Svaka boca se računa. Pitajte Saru.":s.ad===2?"Sada i s regeneratorom. Upitajte Luku.":s.out?"Nijedna boca nije ostala nevraćena. Nijedna.":"Jer u komuni je sve zajedničko. Sve.";
  return `<div class="scr center spons"><div class="sm">${top}</div><div class="feet">${feet}</div>
  <div class="nm3">MARTINA<br>(KOMUNALNA)<br>STOPALA</div><div class="tl">${tl}</div></div>`;}
 case "traubi":return `<div class="scr center spons"><div class="sm">I SU-SPONZOR</div>
 <div class="nm3" style="color:#B79BFF">TRAUBISODA</div><div class="tl">Nije vino. Nije voda.</div>
 <div class="tl" style="animation-delay:3.4s;font-style:normal;font-weight:700;color:var(--krem)">To je Traubisoda.</div></div>`;
 case "quiz":return `<div class="scr center quiz"><p class="h" style="font-size:22px;line-height:1.3">Vaše kritike su zaprimljene.</p>
 <div class="pb"><i></i></div><div class="pc">Uvažavamo ih…</div>
 <div class="zap">Zapravo…</div><div class="lie">SAMO NEKE.</div></div>`;
 case "logo":return `<div class="scr center lg"><div class="heart">♥</div><div class="l1">Love Island</div><div class="l2">ADRIA</div>
 <div class="l3">Sezona 2 · povratak u vilu · još manje filtera</div></div><div class="hint">tapni za početak</div>`;
 case "title":return `<div class="scr center ttl"><div class="logo" style="font-size:30px;animation:fadeIn .5s both">Love Island</div>
 <div class="h" style="letter-spacing:6px;color:var(--koralj);font-size:13px;margin:2px 0 40px">ADRIA</div>
 <span class="ep">Epizoda ${s.ep}</span><div class="nm2">${esc(s.n)}</div></div>`;
 case "narr":return `<div class="scr center"><p class="narr" style="font-size:19px;line-height:1.55">${esc(s.x)}</p></div>`;
 case "scene":return `<div class="scr">${s.l.map((l,i)=>l[0]?`<div class="ln" style="animation-delay:${i*0.18}s">${pill(l[0])}<p>${esc(l[1])}</p></div>`:`<div class="ln" style="animation-delay:${i*0.18}s"><p class="dir">${esc(l[1])}</p></div>`).join("")}</div>`;
 case "conf":return `<div class="scr conf"><p class="lab">🎙 ISPOVJEDAONICA</p><p class="q">„${esc(s.q)}“</p>
 <div class="tag"><span class="h" style="font-size:17px;color:${col(s.w)}">${esc(s.w)}${s.w==="Lara"?" (?)":""}</span></div></div>`;
 case "msg":return `<div class="scr center"><div class="msg"><div class="hd">💬 Love Island Adria · sada</div>
 <div class="bd" style="text-align:left"><b>${esc(s.b)}</b><p>${esc(s.x)}</p></div></div></div>`;
 case "card":return `<div class="scr center"><div class="card" style="text-align:left;border-color:${col(s.w)}">
 <div style="display:flex;justify-content:space-between;align-items:center"><span class="h" style="font-size:19px">${esc(s.w)}</span><span style="color:${col(s.w)}">♥</span></div>
 <div class="art" style="background:${col(s.w)}22;color:${col(s.w)}">${esc(s.w[0])}</div>
 <div class="ty" style="color:${col(s.w)}">${esc(s.ty)}</div><div class="ab">${esc(s.ab)}</div><div class="fl">${esc(s.fl)}</div><div class="pt">${esc(s.pt)}</div></div></div>`;
 case "big":return `<div class="scr center big"><div class="${s.sh?"shake":""}"><div class="t">${esc(s.x)}</div></div><div class="s">${esc(s.s||"")}</div></div>`;
 case "list":return `<div class="scr ep-list"><p class="h" style="font-size:24px;color:var(--pink);margin-bottom:22px">${esc(s.h)}</p>${s.l.map((x,i)=>`<p class="d${Math.min(i+1,7)}">${esc(x)}</p>`).join("")}</div>`;
 case "credits":{
  const R=[["Režija","Komuna (opet)"],["Kasting","isti ljudi, nova pravila"],["Bračna terapija","Salak (YouTube, 1,5x)"],["Asistentica bračne terapije","biljka"],["Financiranje","povratna ambalaža"],["Glavni računovođa","Antun, Casa Ambalaža"],["Pića","Traubisoda, jegervotka, Helenina rakija"],["Mystery green koktel","svi i nitko"],["Ljekarna","Nina"],["Instruktorica vožnje","Nina"],["Kolica koja se gase","Leko"],["Logičke pogreške","Jona i Luka"],["Mama vile","Veronika"],["Tepsija","Matej (pod protestom)"],["Brownies i tiramisu","Kiara"],["Golubovi","Sabina (Njezino Visočanstvo)"],["Outfiti","Marta"],["Lunchboxovi i Nerds","Sara"],["Ginger konzultant","Danijela (smeđa)"],["Dungeon Master","Perić (ne zna)"],["Bič","jednom. U pravom trenutku."],["Posebna zahvala","svima koji su napisali kritike 🫰"]];
  return `<div class="scr credits"><div class="roll"><p class="logo" style="font-size:40px;margin-bottom:40px">Love Island</p>${R.map(r=>`<div class="r"><small>${esc(r[0])}</small><span>${esc(r[1])}</span></div>`).join("")}<p class="narr" style="margin-top:40px">Svi likovi su stvarni. Kritike su uvažene. Neke.</p></div></div>`;}
 case "end":return `<div class="scr center lg"><div class="heart">♥</div><div class="big"><div class="t">KRAJ.</div></div>
 <p class="narr" style="margin-top:22px">Treća sezona? Skupljajte ambalažu.</p><button class="again" id="again">Gledaj ispočetka</button><br><a class="again" style="display:inline-block;margin-top:14px;background:var(--sljiva);color:var(--krem);text-decoration:none" href="../" onclick="event.stopPropagation()">← Sezona 1</a><br><a class="again" style="display:inline-block;margin-top:14px;text-decoration:none" href="../sezona-3/" onclick="event.stopPropagation()">Sezona 3 →</a></div>`;
 }
}

const stage=document.getElementById("stage"),prog=document.getElementById("prog"),lbl=document.getElementById("lbl");
const EP=[];let cur=0;S.forEach(s=>{if(s.t==="title")cur=s.ep;if(s.t==="credits")cur=4;EP.push(cur)});
let k=0;
try{const v=parseInt(localStorage.getItem("lia2-pos"));if(v>0&&v<S.length)k=v}catch(e){}
function show(i){
 k=Math.max(0,Math.min(S.length-1,i));
 stage.innerHTML=render(S[k]);
 prog.style.width=(k/(S.length-1)*100).toFixed(1)+"%";
 const e=EP[k];lbl.textContent=e===0?"Komunalna produkcija":e===4?"Odjavna špica":"Epizoda "+e;
 try{localStorage.setItem("lia2-pos",k)}catch(e){}
 const a=document.getElementById("again");if(a)a.onclick=ev=>{ev.stopPropagation();show(0)};
}
stage.addEventListener("click",ev=>{const r=stage.getBoundingClientRect();show(ev.clientX-r.left<r.width/3?k-1:k+1)});
document.addEventListener("keydown",ev=>{if(["ArrowRight"," ","Enter"].includes(ev.key)){ev.preventDefault();show(k+1)}if(ev.key==="ArrowLeft")show(k-1)});
let tx=null;stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){e.preventDefault();show(dx<0?k+1:k-1)}});
document.getElementById("restart").onclick=ev=>{ev.stopPropagation();show(0)};
show(k);
</script>
</body>
</html>
