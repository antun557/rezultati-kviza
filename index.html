<style>
:root{--noc:#1B1020;--ponoc:#120A16;--sljiva:#2A1B31;--pink:#FF5C93;--koralj:#FF8A6B;--sunce:#FFC93C;--krem:#F4E8EE;--siva:#A8909F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b060d;color:var(--krem);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
.app{position:relative;width:100%;max-width:440px;height:100dvh;margin:0 auto;background:var(--noc);overflow:hidden;user-select:none;-webkit-user-select:none}

.top{position:absolute;top:0;left:0;right:0;z-index:5;padding:max(12px,env(safe-area-inset-top)) 16px 0;pointer-events:none}
.bar{height:3px;background:#3a2840;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--siva)}
.meta button{pointer-events:auto;background:none;border:0;color:var(--siva);font:inherit;font-size:12px;cursor:pointer;padding:4px 0}
.stage{position:absolute;inset:0;cursor:pointer}
.scr{position:absolute;inset:0;padding:78px 24px 40px;display:flex;flex-direction:column;animation:fadeIn .35s ease}
.scr.center{justify-content:center;align-items:center;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.logo{font-family:'Pacifico',cursive;color:var(--pink)}
.narr{font-style:italic;color:var(--siva);font-size:15px;line-height:1.55;margin:0 0 18px}
.ln{margin:0 0 16px;animation:lineIn .4s ease both}
.ln p{font-size:16.5px;line-height:1.5}
.nm{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;padding:2px 10px;border-radius:20px;margin:0 0 4px}
.dir{font-style:italic;color:var(--siva);font-size:15px;line-height:1.5}
@keyframes lineIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.conf{background:var(--ponoc)}
.conf .lab{font-size:12px;letter-spacing:2.5px;color:var(--pink)}
.conf .q{font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:23px;line-height:1.38;margin-top:auto;margin-bottom:auto;animation:lineIn .6s ease both}
.tag{align-self:flex-start;margin-left:-24px;border-left:4px solid var(--pink);background:var(--sljiva);padding:8px 18px 8px 16px;margin-bottom:24px;animation:slideR .5s .3s ease both}
@keyframes slideR{from{transform:translateX(-100%)}to{transform:none}}
.msg{background:var(--sljiva);border-radius:18px;overflow:hidden;width:100%;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.msg .hd{border-top:4px solid var(--sunce);padding:12px 16px 0;font-size:12.5px;color:var(--sunce);font-weight:500;display:flex;gap:8px;align-items:center}
.msg .bd{padding:8px 16px 16px}
.msg .bd b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin-bottom:6px}
.msg .bd p{font-size:16px;line-height:1.5;color:#E0CFD8}
@keyframes pop{0%{transform:translateY(-40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.card{border:7px solid var(--pink);border-radius:16px;background:var(--sljiva);padding:12px;width:100%;animation:cardIn .6s ease both}
@keyframes cardIn{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card .art{height:170px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:64px;margin:8px 0}
.card .ty{font-size:12.5px;font-weight:500;padding:5px 0;border-top:1px solid #4a3352;border-bottom:1px solid #4a3352;margin-bottom:10px}
.card .ab{font-size:14px;line-height:1.5;margin-bottom:10px}
.card .fl{font-size:14px;font-style:italic;color:var(--siva)}
.card .pt{text-align:right;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;color:var(--koralj);margin-top:6px}
.big .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1.08;animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
.big .s{font-size:16px;color:var(--siva);margin-top:18px;line-height:1.5;animation:fadeIn .5s .5s both}
@keyframes slam{0%{transform:scale(2.6);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
.shake{animation:shake .5s .45s both}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}

.ttl .nm2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;line-height:1.15;margin-top:16px;animation:slam .6s .8s both}
.hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12.5px;color:var(--siva);animation:fadeIn .5s 1.2s both;pointer-events:none}
.ep-list p{font-size:15px;line-height:1.5;margin-bottom:12px;animation:lineIn .4s ease both}
.d1{animation-delay:.15s!important}.d2{animation-delay:.3s!important}.d3{animation-delay:.45s!important}.d4{animation-delay:.6s!important}.d5{animation-delay:.75s!important}.d6{animation-delay:.9s!important}.d7{animation-delay:1.05s!important}
.warn{background:#000}
.warn .w1{color:var(--sunce);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:4px;font-size:22px;animation:blink 1s steps(2) 3}
.warn p{font-size:17px;line-height:1.5;margin-top:22px;opacity:0;animation:fadeIn .6s both}
@keyframes blink{50%{opacity:0}}
.prod .row{display:flex;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:2px}
.prod .row span{display:inline-block;opacity:0;animation:drop .5s cubic-bezier(.2,1.6,.4,1) both}
.prod .row.up span{animation-name:rise}

@keyframes rise{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
.prod .pr{font-family:'Pacifico',cursive;color:var(--pink);font-size:24px;margin-top:20px;opacity:0;animation:fadeIn .8s 2.4s both}
.prod .wrap{animation:shake .6s 2s both, zoom 6s 2.6s ease-out both}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.spot{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,92,147,.18),transparent 70%);animation:sweep 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes sweep{from{transform:translate(-120px,-60px)}to{transform:translate(120px,60px)}}
.feet{display:flex;gap:14px;justify-content:center;font-size:30px;height:44px;margin-bottom:26px}
.feet span{opacity:0;animation:step .3s both}
.feet span:nth-child(odd){transform:translateY(10px)}
@keyframes step{from{opacity:0;scale:1.6}to{opacity:1;scale:1}}
.spons .sm{font-size:13px;letter-spacing:3px;color:var(--siva);margin-bottom:18px;animation:fadeIn .6s both}
.spons .nm3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1.1;color:var(--koralj);animation:slam .6s 1.8s both}
.spons .tl{margin-top:18px;font-style:italic;color:var(--siva);animation:fadeIn .6s 2.6s both}
.quiz .pb{width:100%;height:10px;background:#3a2840;border-radius:6px;overflow:hidden;margin:26px 0 10px}
.quiz .pb i{display:block;height:100%;width:0;background:var(--pink);animation:fill 3s cubic-bezier(.3,.8,.4,1) .4s forwards}
@keyframes fill{to{width:99%}}
.quiz .pc{font-size:13px;color:var(--siva)}
.quiz .lie{margin-top:40px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;color:#FF4D4D;opacity:0;animation:glitch .9s 4.4s both}
.quiz .zap{margin-top:18px;font-size:16px;color:var(--siva);opacity:0;animation:fadeIn .5s 3.8s both}
@keyframes glitch{0%{opacity:0;transform:skewX(40deg)}20%{opacity:1;transform:skewX(-30deg) translateX(-10px)}40%{transform:skewX(20deg) translateX(8px);color:#5cf}60%{transform:skewX(-10deg);color:#FF4D4D}100%{opacity:1;transform:none}}
.lg .heart{font-size:54px;color:var(--pink);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.lg .l1{font-family:'Pacifico',cursive;font-size:56px;color:var(--pink);line-height:1.2;animation:slam .8s .3s both}
.lg .l2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:var(--koralj);animation:spread 1.4s 1s both}
@keyframes spread{from{letter-spacing:0;opacity:0}to{letter-spacing:12px;opacity:1}}
.lg .l3{margin-top:40px;font-size:14px;color:var(--siva);animation:fadeIn .6s 2s both}
.credits{overflow:hidden;padding-top:0;padding-bottom:0}
.roll{animation:roll 32s linear both;text-align:center;padding-top:100dvh}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-100%)}}
.roll .r{margin-bottom:22px}
.roll .r small{display:block;font-size:12px;letter-spacing:2px;color:var(--siva);text-transform:uppercase;margin-bottom:3px}
.roll .r span{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px}
.again{pointer-events:auto;margin-top:34px;background:var(--pink);color:#2a0716;border:0;border-radius:24px;padding:12px 26px;font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;animation:fadeIn .6s 1.6s both}
</style>

"Salak":"#D9C27A","Marta":"#FFC2D6","Helena":"#FFAA8F","Lara":"#FFAA8F","Danijela":"#FF6B6B","Veronika":"#E59BFF","Sara":"#9AA8FF","Sabina":"#B8C4CC",

{t:"title",ep:1,n:"Šešir je bio heteroseksualan"},
{t:"narr",x:"Dobrodošli na Love Island Adria. Četrnaest Otočana. Jedna vila. Nula sigurnosnih protokola."},
{t:"narr",x:"Pravila su jednostavna: pronađi ljubav, preživi ostale i ne spominji kviz osobnosti."},
{t:"scene",l:[["","Prva ulazi Nina. Sunčane naočale. Devet je navečer."],["Nina","Može proći."],["","Bazen se, iz poštovanja, malo smiri."]]},
{t:"card",w:"Nina",ty:"Legendarna kraljica · Monarhija",ab:"Kad Nina uđe u igru, svi ostali Otočani dobivaju −1 samopouzdanje. Ne može biti izabrana. Ona bira.",fl:"„Moji su standardi viši od mene.“",pt:"10/10"},
{t:"conf",w:"Nina",q:"Svi misle da tražim savršenog muškarca. Ne. Tražim muškarca koji zna da nije savršen i svejedno se trudi. Dosad nijedan nije prošao drugi krug."},
{t:"scene",l:[["","Antun ulazi. Stane. Okrene se. Skine naočale. Pogleda ravno u kameru."],["Antun","Dame. Ne trudite se."],["Antun","Gospodo. Trudite se."],["Nina","Uvježbao si to."],["Antun","Tri puta. U kupaonici. Drugi put je bio najbolji."]]},
{t:"card",w:"Antun",ty:"Teatralni čarobnjak · Glumac",ab:"Može odigrati spontanost, ali samo ako ju je uvježbao tri puta. Nakon svake scene mora se povući u tišinu na jedan potez.",fl:"„Ovo nije vila. Ovo je moja pozornica.“",pt:"∞/2"},
{t:"scene",l:[["","Luka ulazi. Ne gleda ljude u oči. Gleda dolje."],["Luka","Nina. Lijepa stopala. Sedam i pol."],["Nina","Molim?"],["Luka","Antun, osam. Ali samo zato što si se okrenuo pa sam vidio obje strane."],["Antun","…hvala?"]]},
{t:"card",w:"Luka",ty:"Kaotični otočanin · Legendarni",ab:"Kad netko kaže nešto ozbiljno, Luka dobiva +1 aura i ignorira to. Ocjenjuje stopala svih koji uđu u igru.",fl:"„Bokte, opet riža.“",pt:"6/7"},
{t:"scene",l:[["","Ulazi Jona. Križić oko vrata. Kosa savršena. Vidi Luku."],["Jona","Ne."],["Luka","Jona, brate. Sudbina."],["Jona","Sudbina ne postoji. Postoji Božji plan. I Božji plan sigurno nije ovo."],["Luka","Brate, mi smo… lore."]]},
{t:"card",w:"Jona",ty:"Križarski vitez · Pobožni",ab:"Jednom po potezu smije reći „to je grijeh“. Ne može proći pored ogledala, bazena ni žlice a da ne provjeri kosu.",fl:"„Taština je grijeh. Kako mi stoji kosa?“",pt:"7/7"},
{t:"conf",w:"Jona",q:"Došao sam naći ženu s kojom ću ići na misu. Ako je ne nađem, barem ću se lijepo preplanuti. Taština je grijeh. Preplanulost nije. Provjerio sam."},
{t:"scene",l:[["","Perić ulazi s termosicom. Za svakoga."],["Perić","Kava? Imam i šećer. Imam i špil Magica, ako netko…"],["Leko","Ja ću kavu. Magic poslije."],["Perić","Poslije znači večeras?"],["Leko","Poslije znači poslije, brate."]]},
{t:"card",w:"Perić",ty:"Dobri čarobnjak · Kava",ab:"Na početku svakog jutra stvara token: kava. Kad nitko ne zatraži pomoć, ponudi je svejedno. Dvaput.",fl:"„Igraš Magic? Ne? Naučit ću te.“",pt:"4/4"},
{t:"card",w:"Leko",ty:"Mudri mentor · Dvostruka priroda",ab:"Danju je Leko. Nakon treće pive se transformira u Colea. Cole se ne može ispovjediti do nedjelje.",fl:"„Reći ću ti istinu. Mirno. I bolit će.“",pt:"3/3"},
{t:"scene",l:[["Perić","Mateju, kava?"],["Matej","Ne."],["Perić","Čaj onda?"],["Matej","APSOLUTNO čaj."],["Matej","Usput, letio sam Boeingom 737-800. Pilot je savršeno sletio. Nitko nije pljeskao. To me i dalje muči."]]},
{t:"card",w:"Matej",ty:"Pilot astronaut · Čajni red",ab:"Kava je zabranjena u njegovom radijusu. Može nabrojati sve Boeingove modele po redu. Ne može objasniti 6-7.",fl:"„APSOLUTNO čaj.“",pt:"747/737"},
{t:"scene",l:[["","Ulaze Veronika i Danijela. Danijela nosi mobitel kao oružje."],["Veronika","Bok svima! Ja sam Veronika, nemam pojma što radim ovdje, ali volim vas sve."],["Danijela","Ja sam Danijela. Tko je dirao moj kofer?"],["Luka","Nitko."],["","Danijela zamahne mobitelom. Zvuk biča. Luka sjedne."]]},
{t:"card",w:"Danijela",ty:"Sestra discipline · Kaos",ab:"Zamahom mobitela proizvodi zvuk biča. Svi Otočani muškog spola odmah sjedaju. Jednom dnevno odbije poziv od Johna Porka.",fl:"„Na koljena. Šalim se. Ili ne.“",pt:"5/5"},
{t:"card",w:"Veronika",ty:"Kaotična vidovnjakinja · Bez plana",ab:"Čita misli. Nema pojma što bi s njima. Plan? Što je to?",fl:"„Ovo me plaši.“",pt:"?/?"},
{t:"conf",w:"Veronika",q:"Imam supermoć. Čitam misli. Ušla sam u vilu i pročitala svih trinaest. Ovo me plaši."},
{t:"scene",l:[["","Marta ulazi i zagrli sve. Redom. Uključujući kameru."],["Marta","Bok! Kako ste? Jeste li jeli? Treba li kome nešto?"],["","Sara ulazi iza nje. Stane u kut. Promatra."],["Luka","A ti si?"],["Sara","Sara."],["Luka","I…?"],["Sara","I ništa. Sara."]]},
{t:"card",w:"Marta",ty:"Mirotvorka · Topla",ab:"Smiruje svaku svađu u vili. Svaku. I vodi evidenciju svake.",fl:"„Jedva čekam vidjet što će bit iz ovog.“",pt:"2/9"},
{t:"card",w:"Sara",ty:"Tiha snajperistica · Promatračica",ab:"Ne mora govoriti: jedna podignuta obrva nanosi 3 štete. Pod stresom nanosi 10 štete svemu u blizini, uključujući rižu.",fl:"„Ne.“",pt:"1/10"},
{t:"scene",l:[["Sabina","A brate, šta je ovo? Gdje je hlad?"],["Perić","Kava?"],["Sabina","Ne pijem kavu."],["Perić","Čaj?"],["Sabina","Ni čaj."],["Perić","Što piješ?"],["Sabina","Ništa. Ništa nije dovoljno dobro."]]},
{t:"card",w:"Sabina",ty:"Zlikovka · Prigovor",ab:"Ništa nije dovoljno dobro. Svaki njezin prigovor je zapravo fora, ali to zna samo ona.",fl:"„A brate, šta misliš di idemo.“",pt:"nijedno"},
{t:"scene",l:[["","Ulazi zadnja cura. Ne pozdravlja. Ravno u kuhinju."],["Antun","Kako se zoveš?"],["","Puna usta. Dugo žvakanje."],["Lara","Lara."],["","U kontrolnoj sobi producent provjeri popis. Na popisu nema nikakve Lare."]]},
{t:"card",w:"Lara",ty:"Gladna duša · Pod pseudonimom (?)",ab:"Fanum tax: uzima jedan zalogaj od svake hrane u vili. Može ući u igru pod drugim imenom.",fl:"„Kako se zove smiješni kakao? Ha-ha-o.“",pt:"🍝/🍝"},
{t:"conf",w:"Lara",q:"Moje ime? Nije bitno. Bitno je gdje je hladnjak. … Znate li kako se zove smiješni kakao? Ha-ha-o."},
{t:"scene",l:[["","Salak ulazi zadnji. Sa skicirkom. Gleda izlaz."],["Salak","Bok. Ja sam Salak. Ne tražim ljubav, samo da znate. Nemojte se truditi."],["Veronika","Ovo me plaši."],["Salak","Mene isto."]]},
{t:"card",w:"Salak",ty:"Umjetnik koji ne želi biti ovdje · Agnostik",ab:"Ne može biti izabran za ljubav. Može nacrtati bilo koga. Na partyju zaspi i postane umjetnička instalacija.",fl:"„Ne znam zašto sam ovdje. Ali dobro.“",pt:"2/8"},
{t:"scene",l:[["Luka","Ljudi. Imam prijedlog. Ova vila je komuna."],["Nina","Ne."],["Luka","Komunalni ručnici. Komunalna kava. Komunalna stopala."],["Danijela","Luka, ako još jednom kažeš stopala—"],["","Zvuk biča."],["Luka","Komunalni bič. Prihvaćeno."]]},
{t:"conf",w:"Nina",q:"Ja nisam komuna. Ja sam monarhija. Ustavna, jer sam fer."},

{t:"list",h:"Gdje su sada?",l:["Antun i Matej: Antun piše monodramu, Matej provjerava je li fizika u njoj točna. Nije.","Luka i Salak: platonski brak i zajednička izložba „Stopala komune“.","Nina i Jona: Jona je prošao 47. kriterij. Nina je dodala 48.","Marta i Leko: Marta kaže „ne“ barem jednom dnevno. Leko vodi evidenciju. Ponosno.","Sabina i Veronika: Sabina je životu dala dvicu. Veronika deseticu. Prosjek: sretne.","Sara i Danijela: aplikacija za bič još je instalirana. Sara je nikad nije zabranila.","Helena i Perić: Perić kuha, Helena jede. Lara se više nikad nije pojavila."]},
{t:"credits"},
{t:"spons",out:1},
{t:"end"}
];

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const col=w=>C[w]||"#F4E8EE";
const pill=w=>`<span class="nm" style="background:${col(w)}22;color:${col(w)}">${esc(w)}</span>`;
const word=(t,cls)=>[...t].map((ch,i)=>`<span style="animation-delay:${(i*0.07).toFixed(2)}s">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");

function render(s){
 switch(s.t){
 case "warn":return `<div class="scr center warn"><div class="w1">UPOZORENJE</div>
 <p style="animation-delay:.9s">Sljedeći sadržaj sniman je bez znanja sudionika.</p>
 <p style="animation-delay:2.4s">Šalimo se.</p>
 <p style="animation-delay:3.6s">Djelomično.</p></div><div class="hint">tapni desno za dalje →</div>`;
 case "prod":return `<div class="scr center prod"><div class="spot"></div><div class="wrap">
 <div class="row">${word("KOMUNALNA")}</div><div class="row up">${word("PRODUKCIJA").replace(/animation-delay:([\d.]+)s/g,(m,d)=>"animation-delay:"+(+d+0.8).toFixed(2)+"s")}</div>
 <div class="pr">predstavlja</div></div></div>`;
 case "spons":{
  const feet=[0,1,2,3,4].map(i=>`<span style="animation-delay:${(0.3+i*0.28).toFixed(2)}s">👣</span>`).join("");
  const top=s.ad?"REKLAMA":(s.out?"VIDIMO SE · UZ POTPORU SPONZORA":"UZ POTPORU SPONZORA");
  const tl=s.ad===1?"Dijelimo sve. Doslovno sve.":s.ad===2?"Sada i s komunalnim bičem. Upitajte Danijelu.":s.out?"Nijedno stopalo nije ozlijeđeno tijekom snimanja. Neka su ocijenjena.":"Jer u komuni je sve zajedničko. Sve.";
  return `<div class="scr center spons"><div class="sm">${top}</div><div class="feet">${feet}</div>
  <div class="nm3">MARTINA<br>(KOMUNALNA)<br>STOPALA</div><div class="tl">${tl}</div></div>`;}
 case "quiz":return `<div class="scr center quiz"><p class="h" style="font-size:22px;line-height:1.3">Vaši rezultati kviza osobnosti su spremni.</p>
 <div class="pb"><i></i></div><div class="pc">Analiziramo vaše odgovore…</div>
 <div class="zap">Zapravo…</div><div class="lie">LAGALI SMO.</div></div>`;
 case "logo":return `<div class="scr center lg"><div class="heart">♥</div><div class="l1">Love Island</div><div class="l2">ADRIA</div>
 <div class="l3">Sezona 1 · tri epizode · nula filtera</div></div><div class="hint">tapni za početak</div>`;
 case "title":return `<div class="scr center ttl"><div class="logo" style="font-size:30px;animation:fadeIn .5s both">Love Island</div>
 <div class="h" style="letter-spacing:6px;color:var(--koralj);font-size:13px;margin:2px 0 40px">ADRIA</div>
 <span class="ep">Epizoda ${s.ep}</span><div class="nm2">${esc(s.n)}</div></div>`;
 case "narr":return `<div class="scr center"><p class="narr" style="font-size:19px;line-height:1.55">${esc(s.x)}</p></div>`;
 case "scene":return `<div class="scr">${s.l.map((l,i)=>l[0]?`<div class="ln" style="animation-delay:${i*0.18}s">${pill(l[0])}<p>${esc(l[1])}</p></div>`:`<div class="ln" style="animation-delay:${i*0.18}s"><p class="dir">${esc(l[1])}</p></div>`).join("")}</div>`;
 case "conf":return `<div class="scr conf"><p class="lab">🎙 ISPOVJEDAONICA</p><p class="q">„${esc(s.q)}“</p>
 <div class="tag"><span class="h" style="font-size:17px;color:${col(s.w)}">${esc(s.w)}${s.w==="Lara"?" (?)":""}</span></div></div>`;
 case "msg":return `<div class="scr center"><div class="msg"><div class="hd">💬 Love Island Adria · sada</div>
 <div class="bd" style="text-align:left"><b>${esc(s.b)}</b><p>${esc(s.x)}</p></div></div></div>`;
 case "card":return `<div class="scr center"><div class="card" style="text-align:left;border-color:${col(s.w)}">
 <div style="display:flex;justify-content:space-between;align-items:center"><span class="h" style="font-size:19px">${esc(s.w)}</span><span style="color:${col(s.w)}">♥</span></div>
 <div class="art" style="background:${col(s.w)}22;color:${col(s.w)}">${esc(s.w[0])}</div>
 <div class="ty" style="color:${col(s.w)}">${esc(s.ty)}</div><div class="ab">${esc(s.ab)}</div><div class="fl">${esc(s.fl)}</div><div class="pt">${esc(s.pt)}</div></div></div>`;
 case "big":return `<div class="scr center big"><div class="${s.sh?"shake":""}"><div class="t">${esc(s.x)}</div></div><div class="s">${esc(s.s||"")}</div></div>`;
 case "list":return `<div class="scr ep-list"><p class="h" style="font-size:24px;color:var(--pink);margin-bottom:22px">${esc(s.h)}</p>${s.l.map((x,i)=>`<p class="d${Math.min(i+1,7)}">${esc(x)}</p>`).join("")}</div>`;
 case "credits":{
  const R=[["Režija","Komuna"],["Scenarij","nitko ne priznaje"],["Kasting","šešir iz 1987."],["Catering","Perić"],["Potrošnja cateringa","Helena"],["Vjerski savjetnik","Jona"],["Drugi vjerski savjetnik","Perić"],["Treći vjerski savjetnik","Leko (nakon treće pive: Cole)"],["Disciplina i zvučni efekti","sestra Danijela"],["Čaj konzultant","Matej (APSOLUTNO)"],["Kontrola kvalitete","Nina (47 kriterija)"],["Ocjenjivački sud","Sabina (2/10)"],["Tarot i duhovi","Veronika"],["Glazba","Salak, „Ne želim biti ovdje, op. 2“"],["Smirivanje situacija","Marta (osim na stolu)"],["Obrve","Sara"],["Stopala","Luka"],["Dramaturg, glumac i kada","Antun"],["Posebna zahvala","Lara"]];
  return `<div class="scr credits"><div class="roll"><p class="logo" style="font-size:40px;margin-bottom:40px">Love Island</p>${R.map(r=>`<div class="r"><small>${esc(r[0])}</small><span>${esc(r[1])}</span></div>`).join("")}<p class="narr" style="margin-top:40px">Svi likovi su stvarni. Sve situacije su izmišljene. Uglavnom.</p></div></div>`;}
 case "end":return `<div class="scr center lg"><div class="heart">♥</div><div class="big"><div class="t">KRAJ.</div></div>
 <p class="narr" style="margin-top:22px">Druga sezona? Ovisi o komuni.</p><button class="again" id="again">Gledaj ispočetka</button></div>`;
 }
}

const stage=document.getElementById("stage"),prog=document.getElementById("prog"),lbl=document.getElementById("lbl");
const EP=[];let cur=0;S.forEach(s=>{if(s.t==="title")cur=s.ep;if(s.t==="credits")cur=4;EP.push(cur)});
let k=0;
try{const v=parseInt(localStorage.getItem("lia-pos"));if(v>0&&v<S.length)k=v}catch(e){}
function show(i){
 k=Math.max(0,Math.min(S.length-1,i));
 stage.innerHTML=render(S[k]);
 prog.style.width=(k/(S.length-1)*100).toFixed(1)+"%";
 const e=EP[k];lbl.textContent=e===0?"Komunalna produkcija":e===4?"Odjavna špica":"Epizoda "+e;
 try{localStorage.setItem("lia-pos",k)}catch(e){}
 const a=document.getElementById("again");if(a)a.onclick=ev=>{ev.stopPropagation();show(0)};
}
stage.addEventListener("click",ev=>{const r=stage.getBoundingClientRect();show(ev.clientX-r.left<r.width/3?k-1:k+1)});
document.addEventListener("keydown",ev=>{if(["ArrowRight"," ","Enter"].includes(ev.key)){ev.preventDefault();show(k+1)}if(ev.key==="ArrowLeft")show(k-1)});
let tx=null;stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){e.preventDefault();show(dx<0?k+1:k-1)}});
document.getElementById("restart").onclick=ev=>{ev.stopPropagation();show(0)};
show(k);
</script>
</body>
</html>
